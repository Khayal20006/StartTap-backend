databaseChangeLog:
  - changeSet:
      id: 4-create-file-records
      author: isa
      preconditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: file_records
      changes:
        - createTable:
            tableName: file_records
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: public_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: url
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: original_file_name
                  type: VARCHAR(255)

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: file_records
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_file_user