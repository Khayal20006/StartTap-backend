databaseChangeLog:
  - changeSet:
      id: create-startup-table
      author: isa
      changes:

        - createTable:
            tableName: startup
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: tagline
                  type: VARCHAR(255)

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: category
                  type: VARCHAR(50)

              - column:
                  name: stage
                  type: VARCHAR(50)

              - column:
                  name: website
                  type: VARCHAR(255)

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: startup
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_startup_owner
            onDelete: CASCADE

        - createIndex:
            tableName: startup
            indexName: idx_startup_owner
            columns:
              - column:
                  name: owner_id