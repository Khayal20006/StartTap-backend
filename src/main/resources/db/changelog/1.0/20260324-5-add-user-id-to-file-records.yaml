databaseChangeLog:
  - changeSet:
      id: 20260324-add-user-id-to-file-records
      author: Khayal Sharifov
      changes:
        - addColumn:
            tableName: file_records
            columns:
              - column:
                  name: user_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: file_records
            baseColumnNames: user_id
            constraintName: fk_file_records_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE