databaseChangeLog:
  - changeSet:
      id: 2
      author: isa
      changes:
        - createTable:
            tableName: job
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: salary
                  type: DECIMAL(19,2)
              - column:
                  name: employer_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: is_active
                  type: BOOLEAN
        - addForeignKeyConstraint:
            baseTableName: job
            baseColumnNames: employer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_job_employer