databaseChangeLog:
  - changeSet:
      id: create-verification-token-table
      author: isa
      changes:
        - createTable:
            tableName: verification_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: expiry
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: verification_token
            baseColumnNames: user_id
            constraintName: fk_verification_token_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE