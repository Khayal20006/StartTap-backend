databaseChangeLog:
  - changeSet:
      id: 3-create-vacancy
      author: isa
      changes:
        - createTable:
            tableName: vacancy
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: title
                  type: VARCHAR(255)

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: salary
                  type: DECIMAL(19,2)

              - column:
                  name: startup_id
                  type: BIGINT

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: is_active
                  type: BOOLEAN

        - addForeignKeyConstraint:
            baseTableName: vacancy
            baseColumnNames: startup_id
            referencedTableName: startup
            referencedColumnNames: id
            constraintName: fk_vacancy_startup