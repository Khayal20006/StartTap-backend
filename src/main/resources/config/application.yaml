spring:
  application:
    name: quill
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true


  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quill-db}
    username: ${SPRING_DATASOURCE_USERNAME:isa}
    password: ${SPRING_DATASOURCE_PASSWORD:isaisa}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  level:
    root: debug

dreamSecretKey2006: ${SALT_KEY:test-secret-key}
jwt:
  expiration: 900000
  refresh-expiration: 604800000


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:test-cloud}
  api-key: ${CLOUDINARY_API_KEY:test-key}
  api-secret: ${CLOUDINARY_API_SECRET:test-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always




